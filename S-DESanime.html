<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S-DES animé</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--bd:#cfd5e3;--ac:#2f5bea;--ok:#0f8a5f;--err:#c8362f;--code:#e9ecf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mut:#98a0b3;--bd:#363c4d;--ac:#5c82ff;--ok:#2fbf8c;--err:#ff7b72;--code:#262a38}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1e27;--tx:#e8eaf0;--mut:#98a0b3;--bd:#363c4d;--ac:#5c82ff;--ok:#2fbf8c;--err:#ff7b72;--code:#262a38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.45rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:4px}
.row{display:flex;gap:8px}
input,select{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:1rem ui-monospace,Menlo,Consolas,monospace}
select{flex:none;font-family:inherit}
button{padding:9px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.dec{background:var(--ok)}
.err{color:var(--err);font-size:.88rem;min-height:1.2em;margin-top:6px}
.res{font:700 1.15rem ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-bottom:8px}
#scene{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;--d:.8s}
@media(max-width:700px){#scene{grid-template-columns:1fr}}
.lane{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 10px 20px;display:flex;flex-direction:column;align-items:center}
.lane h3{margin:0 0 40px;font-size:.95rem}
.stage{display:flex;flex-direction:column;align-items:center;margin-bottom:52px}
.sep{font-size:.78rem;color:var(--mut);border-top:1px dashed var(--bd);width:90%;text-align:center;padding-top:4px;margin:0 0 44px}
.shape{display:flex;gap:10px;justify-content:center}
.c{display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--code);color:var(--tx);transition:background .3s,transform .3s,color .3s}
.rect .c{width:170px;height:56px;border-radius:10px;border:2px solid var(--bd)}
.exp .c{width:170px;height:56px;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.red .c{width:170px;height:56px;clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}
.circle .c{width:56px;height:56px;border-radius:50%;border:2px solid var(--bd);font-size:1.05rem}
.sbox .c{width:90px;height:64px;clip-path:polygon(0 0,100% 0,50% 100%);align-items:flex-start;padding-top:8px}
.shape.on .c{background:var(--ac);color:#fff;transform:scale(1.07)}
.shape.done .c{background:color-mix(in srgb,var(--ok) 28%,var(--code))}
.io{font:.75rem ui-monospace,Menlo,Consolas,monospace;color:var(--mut);margin-top:6px;min-height:1.1em;text-align:center}
.kb{display:flex;gap:12px}
.badge{border:2px dashed var(--bd);border-radius:10px;padding:6px 14px;text-align:center;font-size:.8rem;color:var(--mut)}
.badge b{display:block;font:700 .95rem ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
.chip{position:absolute;transform:translate(-50%,-50%);padding:4px 10px;border-radius:999px;background:var(--ac);color:#fff;font:700 .9rem ui-monospace,Menlo,Consolas,monospace;transition:left var(--d) ease,top var(--d) ease;z-index:5;pointer-events:none;white-space:nowrap}
.chip[data-n=k]{background:var(--ok)}.chip[data-n=L]{background:#d9822b}.chip[data-n=R]{background:#8b5cf6}
.chip.final{background:var(--ok);outline:3px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.pop{animation:pop .45s ease}
@keyframes pop{0%{scale:.3;opacity:0}100%{scale:1;opacity:1}}
</style>
</head>
<body>
<main>
<h1>S-DES animé</h1>
<p class="sub">Chaque valeur entre dans un composant, puis ressort transformée.</p>

<div class="card">
  <div class="row">
    <div style="flex:2"><label for="key">Clé (10 bits)</label><input id="key" value="1010000010" maxlength="10" inputmode="numeric"></div>
    <div style="flex:1"><label for="spd">Vitesse</label><select id="spd"><option value="1.7">Lente</option><option value="1" selected>Normale</option><option value="0.5">Rapide</option></select></div>
  </div>
  <div class="err" id="err"></div>
  <div class="grid" style="margin-top:6px">
    <div><label for="pt">Séquence à chiffrer (8 bits)</label><div class="row"><input id="pt" value="10011101" maxlength="8" inputmode="numeric"><button id="bEnc">Envoyer</button></div></div>
    <div><label for="ct">Séquence à déchiffrer (8 bits)</label><div class="row"><input id="ct" value="01110011" maxlength="8" inputmode="numeric"><button class="dec" id="bDec">Envoyer</button></div></div>
  </div>
</div>

<div class="res" id="res"></div>
<div class="legend"><span>● bleu : bloc principal</span><span style="color:#d9822b">● L</span><span style="color:#8b5cf6">● R</span><span style="color:var(--ok)">● clé</span></div>
<div id="scene"></div>
</main>

<script>
const IP=[2,6,3,1,4,8,5,7],IPI=[4,1,3,5,7,2,8,6],EP=[4,1,2,3,2,3,4,1],P4=[2,4,3,1],
P10=[3,5,2,7,4,10,1,9,8,6],P8=[6,3,7,4,8,5,10,9];
const S0=[[1,0,3,2],[3,2,1,0],[0,2,1,3],[3,1,3,2]],S1=[[0,1,2,3],[2,0,1,3],[3,0,1,0],[2,1,0,3]];
const perm=(s,t)=>t.map(i=>s[i-1]).join(""),xor=(a,b)=>[...a].map((c,i)=>c^b[i]).join(""),
ls=(s,n)=>s.slice(n)+s.slice(0,n),sbox=(S,b)=>S[parseInt(b[0]+b[3],2)][parseInt(b[1]+b[2],2)].toString(2).padStart(2,"0");
const $=id=>document.getElementById(id);

/* ---------- données du pipeline ---------- */
function data(inp,key,dec){
  const p=perm(key,P10),l1=ls(p.slice(0,5),1),r1=ls(p.slice(5),1),k1=perm(l1+r1,P8),
        l2=ls(l1,2),r2=ls(r1,2),k2=perm(l2+r2,P8),KV={K1:k1,K2:k2};
  const ks=[
    {lbl:"P10",shape:"rect",take:["x"],put:{x:p}},
    {lbl:"LS-1",shape:"rect",take:["x"],put:{x:l1+r1}},
    {lbl:"P8",shape:"red",take:["x"],put:{x:l1+r1,k:k1},store:"K1"},
    {lbl:"LS-2",shape:"rect",take:["x"],put:{x:l2+r2}},
    {lbl:"P8",shape:"red",take:["x"],put:{x:l2+r2,k:k2},store:"K2"}];
  const cs=[],x0=perm(inp,IP);
  let L=x0.slice(0,4),R=x0.slice(4);
  cs.push({lbl:"IP",shape:"rect",take:["x"],put:{x:x0}});
  cs.push({lbl:"Découpe L | R",shape:"rect",take:["x"],put:{L,R}});
  const f=kn=>{
    const e=perm(R,EP),xx=xor(e,KV[kn]),s0=sbox(S0,xx.slice(0,4)),s1=sbox(S1,xx.slice(4)),
          pp=perm(s0+s1,P4),n=xor(L,pp);
    cs.push({sep:"fK avec "+kn});
    cs.push({lbl:"E/P",shape:"exp",take:["R"],put:{R,e}});
    cs.push({lbl:"⊕ "+kn,shape:"circle",take:["e"],key:kn,put:{x:xx}});
    cs.push({lbl:"S0 | S1",shape:"sbox",take:["x"],put:{a:s0,b:s1}});
    cs.push({lbl:"P4",shape:"rect",take:["a","b"],put:{p:pp}});
    cs.push({lbl:"⊕ L",shape:"circle",take:["p","L"],put:{n}});
    return n;};
  const [ka,kb]=dec?["K2","K1"]:["K1","K2"];
  const n1=f(ka);
  cs.push({lbl:"SW",shape:"rect",take:["n","R"],put:{L:R,R:n1}});
  L=R;R=n1;
  const n2=f(kb),out=perm(n2+R,IPI);
  cs.push({lbl:"IP⁻¹",shape:"rect",take:["n","R"],put:{x:out},last:true});
  return {ks,cs,KV,out};
}

/* ---------- moteur d’animation ---------- */
const scene=$("scene");let chips={},runId=0,T=1;
const sleep=(ms,id)=>new Promise((ok,ko)=>setTimeout(()=>id===runId?ok():ko("x"),ms*T));
function rel(el){const s=scene.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2,t:r.top-s.top,w:r.width,l:r.left-s.left};}
function mk(n,v,x,y){if(chips[n])chips[n].remove();const c=document.createElement("div");
  c.className="chip";c.dataset.n=n;c.textContent=v;c.style.left=x+"px";c.style.top=y+"px";
  scene.appendChild(c);chips[n]=c;return c;}
const go=(c,x,y)=>{c.style.left=x+"px";c.style.top=y+"px";};

function buildLane(id,title,stages,withBadges){
  const lane=document.createElement("div");lane.className="lane";lane.id=id;
  lane.innerHTML="<h3>"+title+"</h3>";
  stages.forEach(s=>{
    const d=document.createElement("div");
    if(s.sep){d.className="sep";d.textContent=s.sep;}
    else{d.className="stage";
      const inner=s.shape==="sbox"?'<div class="c">S0</div><div class="c">S1</div>':'<div class="c">'+s.lbl+"</div>";
      d.innerHTML='<div class="shape '+s.shape+'">'+inner+'</div><div class="io"></div>';
      s.el=d.querySelector(".shape");s.io=d.querySelector(".io");}
    lane.appendChild(d);});
  if(withBadges)lane.insertAdjacentHTML("beforeend",'<div class="kb"><div class="badge" id="kb-K1">K1<b>—</b></div><div class="badge" id="kb-K2">K2<b>—</b></div></div>');
  scene.appendChild(lane);return lane;
}

async function runLane(lane,stages,id,start){
  Object.values(chips).forEach(c=>c.remove());chips={};
  const gx=rel(lane).l+50;let first=true;
  for(const st of stages){
    if(st.sep)continue;
    st.el.scrollIntoView({block:"center",behavior:"smooth"});
    const R=rel(st.el);
    if(first){mk("x",start,R.x,R.t-40);first=false;await sleep(500,id);}
    const names=[...st.take];
    if(st.key){const b=rel($("kb-"+st.key));mk("k",$("kb-"+st.key).querySelector("b").textContent,b.x,b.y);names.push("k");}
    const main=names.filter(n=>n!=="k");
    const others=Object.keys(chips).filter(n=>!names.includes(n));
    others.forEach((n,i)=>go(chips[n],gx,R.y+(i-(others.length-1)/2)*34));
    names.forEach(n=>n==="k"?go(chips.k,R.x+R.w/2+80,R.y):go(chips[n],R.x+(main.indexOf(n)-(main.length-1)/2)*100,R.t-38));
    await sleep(950,id);
    names.forEach(n=>go(chips[n],R.x,R.y));
    st.el.classList.add("on");await sleep(850,id);
    const inV=names.map(n=>chips[n].textContent).join(" | ");
    names.forEach(n=>{chips[n].remove();delete chips[n];});
    const out=Object.keys(st.put);
    out.forEach((n,i)=>mk(n,st.put[n],R.x+(i-(out.length-1)/2)*100,R.y).classList.add("pop"));
    st.io.textContent=inV+" → "+out.map(n=>st.put[n]).join(" | ");
    await sleep(750,id);
    st.el.classList.replace("on","done");
    if(st.store){const bd=$("kb-"+st.store),b=rel(bd);go(chips.k,b.x,b.y);await sleep(950,id);
      bd.querySelector("b").textContent=st.put.k;chips.k.remove();delete chips.k;}
    if(st.last){chips.x.classList.add("final");}
  }
}

async function start(dec){
  const inp=$(dec?"ct":"pt").value.trim(),key=$("key").value.trim();
  $("err").textContent="";
  if(!/^[01]{10}$/.test(key)){$("err").textContent="La clé doit contenir exactement 10 bits.";return;}
  if(!/^[01]{8}$/.test(inp)){$("err").textContent="La séquence doit contenir exactement 8 bits.";return;}
  const id=++runId;T=+$("spd").value;scene.style.setProperty("--d",(0.85*T)+"s");
  $("res").textContent="";scene.innerHTML="";chips={};
  const d=data(inp,key,dec);
  const lk=buildLane("laneK","Génération des clés",d.ks,true),
        lc=buildLane("laneC",dec?"Déchiffrement":"Chiffrement",d.cs,false);
  try{
    await sleep(300,id);
    await runLane(lk,d.ks,id,key);
    await runLane(lc,d.cs,id,inp);
    $("res").textContent=(dec?"Texte clair : ":"Texte chiffré : ")+d.out+"   (K1="+d.KV.K1+", K2="+d.KV.K2+")";
  }catch(e){if(e!=="x")throw e;}
}
$("bEnc").onclick=()=>start(false);
$("bDec").onclick=()=>start(true);
</script>
</body>
</html>
